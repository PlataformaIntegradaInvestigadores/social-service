# redis.conf
#
# The password is NOT set here. docker-compose.yml starts redis with
# `--requirepass $REDIS_PASSWORD`, so Redis, Django/Channels and Celery all
# read the same value from `.env`. Never commit a password to this file.

# Listen on all interfaces inside the container. Host exposure is limited by
# the port mapping in docker-compose.yml (127.0.0.1 only).
bind 0.0.0.0
